[project]
name = "northstar-investment-analytics"
version = "0.1.0"
description = "Northstar: an India-focused investment learning and portfolio analytics platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Ayush Kumar" }
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9"
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "backend"
]
testpaths = [
  "backend"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
